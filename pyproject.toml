[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "surf-web"
version = "1.0.0"
description = "A local web toolkit for AI agents: search, extraction, browser automation and more over MCP."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ayan Nag" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.136.3",
    "uvicorn[standard]==0.49.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.1",
    "playwright==1.61.0",
    "httpx==0.28.1",
    "curl_cffi==0.15.0",
    "adblock==0.6.0",
    "mcp==1.27.2",
    "structlog==25.5.0",
    "psutil==7.2.2",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# youtube_transcript: yt-dlp plus its bundled JavaScript runtime (~100 MB).
youtube = ["yt-dlp[default,deno]==2026.6.9"]
# PDF / DOCX / XLSX text extraction from downloads (~26 MB).
docs = ["pypdf>=4.0,<5.0", "python-docx>=1.1.0", "openpyxl>=3.1.0"]
all = ["surf-web[youtube,docs]"]

[project.scripts]
surf-mcp = "surfctl:mcp_main"
surfctl = "surfctl:main"
surf = "cli.surf_cli:main"
surf-server = "start_surf:main"

[project.urls]
Homepage = "https://github.com/nomadbarefoot/SURF"

[tool.setuptools]
py-modules = ["main", "surfctl", "start_surf"]

[tool.setuptools.packages.find]
include = ["cli", "config", "controllers", "core", "models", "services", "utils", "skills"]
namespaces = true

[tool.setuptools.package-data]
config = ["*.yaml"]
skills = ["*/SKILL.md", "*/agents/*"]
cli = ["SKILL.md"]
