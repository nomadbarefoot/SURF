# Proxy Configuration for SURF
#
# Proxies are optional. When a browser profile selects proxy.mode: sticky, one
# entry from this pool is assigned per context and kept for the session.
# Rotation happens only after classified transport/proxy failures within the
# configured budget.
#
# Credentials are read from environment variables at runtime. Do not commit
# secrets to this file.

proxies:
  # Example entry (commented out). Add real entries without hard-coded secrets:
  # - server: "http://proxy.example.com:8080"
  #   username: "${PROXY_USER}"
  #   password: "${PROXY_PASS}"
  #   protocol: "http"

# Rotation settings
rotation:
  max_failures: 3          # Mark proxy as failed after this many proxy-classified failures
  reset_interval: 3600     # Reset failed proxies after this many seconds

# Set to true to allow private/loopback proxy endpoints (testing only).
allow_private_proxies: false

# Legacy sections retained for tooling that reads them. They are not used by
# the new sticky proxy pool.
captcha:
  detection_enabled: true
  backoff_min: 300
  backoff_max: 600
  screenshot_on_detection: true

human_behavior:
  min_delay: 0.5
  max_delay: 2.0
  scroll_pauses: 3
  mouse_movements: true
  typing_speed: 0.1

smart_waiting:
  content_load_timeout: 30000
  dynamic_content_timeout: 10000
  image_load_threshold: 0.8
  network_idle_timeout: 5000
